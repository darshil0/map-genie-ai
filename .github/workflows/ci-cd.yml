name: Map-Genie CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 0'

env:
  NODE_VERSION: 18
  PYTHON_VERSION: '3.12'
  REGISTRY: gcr.io
  GCP_REGION: us-central1
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  IMAGE_NAME: map-genie

jobs:
  # ============================================================================
  # STAGE 1: LINT & BUILD
  # ============================================================================
  validate-and-build:
    name: 'Lint, Validate, & Build Artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build-artifact-id: ${{ steps.build.outputs.artifact-id }}
      git-sha: ${{ github.sha }}
      branch-name: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler check (Lint)
        run: npm run lint

      - name: Build production bundles
        id: build
        run: |
          npm run build
          echo "artifact-id=$(date +%s)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ] || [ ! -f dist/server.cjs ]; then
            echo "❌ Build failed: Missing dist/index.html or dist/server.cjs"
            exit 1
          fi
          echo "✅ Build artifacts validated"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.build.outputs.artifact-id }}
          path: dist/
          retention-days: 7

  # ============================================================================
  # STAGE 2: TESTS (NODE & PYTHON)
  # ============================================================================
  test:
    name: 'Unit & Integration Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate-and-build
    strategy:
      matrix:
        node-version: [ 18, 20 ]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          pip install -r backend_python/requirements.txt

      - name: Run Node.js Tests
        run: npm test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_key' }}
          NODE_ENV: test

      - name: Run Python Tests
        run: python -m pytest backend_python/test_server.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_key' }}

  # ============================================================================
  # STAGE 3: SECURITY SCANNING
  # ============================================================================
  security-scan:
    name: 'Security & Dependency Scanning'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for known vulnerabilities (npm audit)
        run: npm audit --production
        continue-on-error: true

  # ============================================================================
  # STAGE 4: BUILD CONTAINER IMAGE
  # ============================================================================
  build-container:
    name: 'Build Docker Image'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ validate-and-build, test, security-scan ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.validate-and-build.outputs.build-artifact-id }}
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ============================================================================
  # STAGE 5: NOTIFICATIONS & REPORTING
  # ============================================================================
  notify:
    name: 'Notifications'
    runs-on: ubuntu-latest
    if: always()
    needs: [ validate-and-build, test, security-scan, build-container ]
    steps:
      - name: CI/CD Summary
        run: |
          echo "Pipeline run completed for commit ${{ github.sha }} on branch ${{ github.ref_name }}"
