name: Map-Genie CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-genie-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: map-genie
  BUILD_ARTIFACT_NAME: map-genie-dist

jobs:
  # ============================================================================
  # STAGE 1: LINT & BUILD
  # ============================================================================
  validate-and-build:
    name: Lint, Validate, & Build Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      git-sha: ${{ steps.metadata.outputs.git-sha }}
      branch-name: ${{ steps.metadata.outputs.branch-name }}
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set workflow metadata
        id: metadata
        shell: bash
        run: |
          echo "git-sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch-name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact-name=${BUILD_ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify lockfile integrity
        run: npm ci --dry-run

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run lint

      - name: Audit npm dependencies for security
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Build production bundles
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "dist" ]]; then
            echo "::error::Build failed: dist directory was not created."
            exit 1
          fi

          if [[ ! -f "dist/index.html" ]]; then
            echo "::error::Build failed: dist/index.html is missing."
            exit 1
          fi

          if [[ ! -f "dist/server.cjs" ]]; then
            echo "::error::Build failed: dist/server.cjs is missing."
            exit 1
          fi

          echo "✓ Build artifacts validated successfully."
          ls -lh dist/

      - name: Upload build artifacts
        id: upload-build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  # ============================================================================
  # STAGE 2: TESTS (NODE & PYTHON)
  # ============================================================================
  test:
    name: Unit & Integration Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate-and-build

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "18"
          - "20"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node.js tests
        run: npm test
        env:
          NODE_ENV: test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_key_placeholder' }}

      - name: Check for Python backend
        id: python-backend-check
        shell: bash
        run: |
          if [[ -f "backend_python/requirements.txt" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.python-backend-check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend_python/requirements.txt

      - name: Install Python dependencies
        if: steps.python-backend-check.outputs.exists == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend_python/requirements.txt

      - name: Run Python backend tests
        if: steps.python-backend-check.outputs.exists == 'true'
        run: python -m pytest backend_python/ -v --tb=short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_key_placeholder' }}

  # ============================================================================
  # STAGE 3: SECURITY SCANNING
  # ============================================================================
  security-scan:
    name: Security & Dependency Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Scan production dependencies for high-severity vulnerabilities
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # ============================================================================
  # STAGE 4: BUILD CONTAINER IMAGE
  # ============================================================================
  build-container:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - validate-and-build
      - test
      - security-scan

    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate-and-build.outputs.artifact-name }}
          path: dist

      - name: Verify downloaded build artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html || (echo "::error::dist/index.html not found" && exit 1)
          test -f dist/server.cjs || (echo "::error::dist/server.cjs not found" && exit 1)
          echo "✓ Build artifacts verified:"
          ls -lh dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "${IMAGE_NAME}:${GITHUB_SHA}" >/dev/null
          echo "✓ Docker image built successfully: ${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Clean up build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.validate-and-build.outputs.artifact-name }}
          retention-days: 0

  # ============================================================================
  # STAGE 5: NOTIFICATIONS & REPORTING
  # ============================================================================
  notify:
    name: CI/CD Summary
    runs-on: ubuntu-latest
    if: always()

    needs:
      - validate-and-build
      - test
      - security-scan
      - build-container

    steps:
      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## 🚀 Map-Genie CI/CD Pipeline Summary"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Event | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Build & Validate | \`${{ needs.validate-and-build.result }}\` |"
            echo "| Tests | \`${{ needs.test.result }}\` |"
            echo "| Security Scan | \`${{ needs.security-scan.result }}\` |"
            echo "| Container Build | \`${{ needs.build-container.result }}\` |"
            echo ""
            if [[ "${{ job.status }}" == "success" ]]; then
              echo "✅ **Pipeline Status**: Success"
            else
              echo "❌ **Pipeline Status**: Failed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check critical job results
        shell: bash
        run: |
          VALIDATE_RESULT="${{ needs.validate-and-build.result }}"
          TEST_RESULT="${{ needs.test.result }}"
          SECURITY_RESULT="${{ needs.security-scan.result }}"

          if [[ "$VALIDATE_RESULT" != "success" ]]; then
            echo "::error::Build and validation job failed (result: $VALIDATE_RESULT)"
            exit 1
          fi

          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "::error::Test job failed (result: $TEST_RESULT)"
            exit 1
          fi

          if [[ "$SECURITY_RESULT" == "failure" ]]; then
            echo "::error::Security scan job failed (result: $SECURITY_RESULT)"
            exit 1
          fi

          echo "✅ All critical pipeline stages passed."
